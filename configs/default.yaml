# =============================================================================
# cyclicnano - default configuration
#
# Every subjective decision in the manual protocol appears here as a number.
# Thresholds are deliberately conservative starting points, NOT validated values;
# stage 01 and 04 are cheap to replay, so tune them against a real run rather than
# trusting these defaults.
# =============================================================================

run:
  name: c5_60aa_v1
  # Results land in <outroot>/<name>. A machine profile sets outroot, so the run
  # config only has to say what the run is called. Setting outdir overrides both.
  outroot: runs
  outdir: null
  # Must be non-zero: ProteinMPNN treats --seed 0 as a request for a RANDOM seed,
  # so leaving it at 0 silently makes sequence design irreproducible.
  seed: 1

# ------------------------------------------------------------------ design target
target:
  symmetry: C5                # C2..C12; the whole pipeline is parameterised by this
  monomer_length: 60          # residues per chain (RFdiffusion is told n_sym x this)
  n_backbones: 50             # total backbones to generate

# ------------------------------------------------- 00  backbone generation
generate:
  tool: rfdiffusion
  batch_size: 10              # designs per RFdiffusion invocation
  hydra_run_dir: null         # default: <outdir>/logs/hydra
  output_prefix: design       # files come out as design_0.pdb .. design_N-1.pdb
  # Normally left null: the stage counts what is on disk and tells RFdiffusion where
  # to continue, so batches number consecutively. Set an integer to pin the start
  # index, which with deterministic seeding also selects WHICH designs you get:
  # raise it past n_backbones to draw a fresh, non-overlapping set.
  design_startnum: null
  # RFdiffusion seeds each design from its index when this is on, so a run is
  # reproducible from its config alone. Off, it seeds from entropy and the same
  # command yields different structures every time. Note that run.seed does not
  # reach stage 00; design_startnum is what shifts the draw.
  deterministic: true
  # Trajectory files dominate the output and nothing reads them: 50 C5 backbones
  # wrote 337 MB of them against 4 MB of structures.
  write_trajectory: false
  keep_trb: false             # RFdiffusion metadata, unused downstream
  potentials:
    # On by default, from 50 backbones generated with them against 10 generated
    # without, all C5 at 60 residues. Medians, with -> without:
    #   helix fraction    0.57 -> 0.36      strand fraction  0.27 -> 0.41
    #   rg_ratio          1.13 -> 1.30      shape anisotropy 0.30 -> 0.44
    # Clash rate is NOT improved: 26% of 50 with, 30% of 10 without. An earlier note
    # here claimed the potentials eliminated clashes, which came from a sample of 8
    # and did not survive the larger run.
    enabled: true
    # olig_contacts is chain-aware (it takes chain_lengths), so weight_intra is the
    # correct knob for "make each subunit more compact".
    #
    # Do NOT reach for monomer_ROG here. Its compute() reads xyz[:, 1] over all L
    # residues and it has no chain_lengths argument, so on a symmetric oligomer it
    # shrinks the whole ring instead of the individual subunits.
    olig_contacts: {weight_intra: 1, weight_inter: 0.1}
    r_0: null                 # contact distance scale; RFdiffusion default is 8
    d_0: null                 # contact offset; RFdiffusion default is 2
    guide_scale: 2
    guide_decay: quadratic
  # Reverse-diffusion noise, scaling what is added at each sampling step. null leaves
  # the RFdiffusion default of 1.0, the amount used during training. Lower values make
  # the output more regular at some cost in diversity.
  #
  # ONE key, not two: RFdiffusion exposes noise_scale_ca (translations) and
  # noise_scale_frame (rotations) separately but recommends keeping them tied, so this
  # sets both. Measured on 40 C5 backbones per condition, identical seeds throughout:
  #
  #   noise   >=3 helices   no beta   median longest helix   passes the preset
  #   1.0        0/40        5/40            19 res               4/200
  #   0.5        5/40       11/40            18 res               3/40
  #   0.0        4/40       26/40            28 res               2/40
  #
  # 0.0 is a trap. It maximises helicity, and that is not the same as producing the
  # wanted fold: the two-helix count rises to 34 of 40 and the helices lengthen to a
  # median of 28 residues, which is the long-hairpin regime the protocol rules out.
  noise_scale: null
  # Hydra aborts on a key its config does not define, so the seed flag is opt-in.
  # Set to the key your RFdiffusion build accepts (e.g. inference.seed) once verified.
  seed_key: null
  extra_args: []              # passed through verbatim to run_inference.py

# ------------------------------------------------- 01  backbone filtering
# All 29 metrics are computed and stored for every backbone regardless of what is
# listed here; these rules only set the pass flag.
#
# The list is EMPTY by default, so nothing is rejected and every backbone reaches
# sequence design. The metrics are still recorded, so a filter can be applied after
# the fact by adding rules and replaying this stage alone -- no GPU work is repeated.
#
# Example rules, should you want to enable filtering later:
#   - "n_clash == 0"                     # no backbone overlap
#   - "sym_order_ok"                     # detected Cn matches the request
#   - "helix_frac >= 0.35"               # loop-dominated backbones are undesignable
#   - "rg_ratio <= 1.30"                 # compact relative to 2.2 * N^0.38
#   - "shape_anisotropy <= 0.50"         # 0 is a sphere, 1 is a rod
# configs/presets/ holds the rule sets that have been used, each with its reasoning.
backbone_filter:
  rules: []

# ------------------------------------------------- 02  sequence design
design:
  tool: proteinmpnn
  n_seq_per_backbone: 10
  sampling_temp: 0.1
  use_soluble_model: true
  omit_aas: "CX"              # no free cysteines in a de novo oligomer
  tie_chains: true            # MANDATORY for homo-oligomers; all chains share a sequence

# ------------------------------------------------- 03  structure prediction
fold:
  tool: colabfold             # AlphaFold2 weights via localcolabfold
  msa_mode: single_sequence   # de novo designs have no homologues; an MSA is noise
  use_templates: false
  num_models: 1
  num_recycle: 3
  model_type: null            # null uses the colabfold_batch default (alphafold2_ptm)
  random_seed: null           # opt-in; the verified invocation does not set it
  predict: monomer            # single chain only, per protocol
  # colabfold_batch writes eight files per sequence and two are read downstream;
  # true keeps the plots, a3m and PAE dumps as well.
  keep_all_outputs: false

# ------------------------------------------------- 04  self-consistency
validate:
  rmsd_cutoff: 1.0            # CA RMSD, predicted monomer vs design backbone
  plddt_cutoff: 80.0
  also_record: [1.5, 2.0]     # extra cutoffs stored for later re-analysis
  rules:
    - "success_rate >= 0.3"   # a backbone passes if >=30% of its sequences fold back

  # A `best_rmsd <= 1.0` rule used to sit here and was removed as dead. It could never
  # reject anything: a sequence passes only if its RMSD is at or below rmsd_cutoff, so
  # any backbone with a non-zero success rate already has its minimum below that, and
  # the rule restated the cutoff above under another name. On 16 C5 and 45 C3 backbones
  # it rejected none; on C3 it would have admitted 36 where the success rate admitted 27.
  #
  # It was not harmless, because it only looked redundant while the two numbers agreed.
  # Raising rmsd_cutoff to the 2.0 the literature usually uses would have turned it into
  # a real and quite different constraint, 30 percent within 2.0 A and the best within
  # 1.0 A, without anyone deciding that. If you want that constraint, write it with a
  # threshold of its own and say what the number is for; do not let it track rmsd_cutoff
  # by accident.

# ------------------------------------------------- 05  interface evaluation
# Description, not selection. Nothing here feeds success_rate or final_pass; a weak
# interface marks a design rather than removing it, which is what was asked for.
#
# It runs only on the sequences that passed stage 04, of the backbones that passed,
# because the question is how the designs that got through assemble and not whether
# to let more of them through.
interface:
  # ipTM is not defined for a single chain, so the oligomer has to be folded again
  # with the multimer model. For C5 that is 300 residues rather than 60, about 40
  # seconds a sequence against roughly one for the monomer.
  model_type: alphafold2_multimer_v3
  msa_mode: single_sequence   # a de novo design has no homologues as five chains either
  num_recycle: 3
  num_models: 1
  # Rosetta cannot score an unrelaxed AlphaFold model usefully: a 300-residue pentamer
  # came in at +7189 and left at -1065, a gap made of small clashes rather than of
  # anything about the design. One restrained cycle costs about 85 seconds.
  relax_cycles: 1

# ------------------------------------------------- execution
compute:
  # null leaves card selection alone (no CUDA_VISIBLE_DEVICES), which is right when
  # the machine is idle. Set an explicit list to confine the run to those cards.
  gpus: null
  max_parallel: 1
  cuda_device_order: PCI_BUS_ID   # required on multi-GPU boxes with mixed cards

paths:
  rfdiffusion: null           # e.g. /data/lmk/RFdiffusion
  proteinmpnn: null           # e.g. /data/lmk/ProteinMPNN
  colabfold: null             # e.g. path to the colabfold_batch executable
  colabfold_params: null      # REQUIRED for stage 03: the --data weight directory

backend:
  kind: conda                 # conda | docker | apptainer | local
  envs:
    rfdiffusion: lmk_RFdiffusion
    proteinmpnn: lmk_ProteinMPNN
    rosetta: null             # stage 05 interface energy; set it in the machine profile
    colabfold: null           # pixi-managed installs register no conda env
  # Tools with no conda env are activated here instead. PATH, LD_LIBRARY_PATH and
  # PYTHONPATH are prepended to the existing value; anything else is set outright.
  tool_env: {}
  images:
    rfdiffusion: null
    proteinmpnn: null
    rosetta: null
    colabfold: null
