# Machine profile: amax lab server (Ubuntu 20.04, 8 GPUs, shared with other users).
#
# Overlay on top of default.yaml:
#   cyclicnano run --config my_run.yaml --profile configs/profiles/amax.yaml
#
# Verify the three tool paths against the actual installation before the first run.

run:
  outroot: /data/lmk/cyclicnano_outputs   # results live outside the code directory

compute:
  # The eight cards on this box are normally idle and these jobs are small, so no
  # pinning by default. Set an explicit list when a run must stay on chosen cards.
  gpus: null
  max_parallel: 2
  cuda_device_order: PCI_BUS_ID

paths:
  rfdiffusion: /data/lmk/RFdiffusion
  proteinmpnn: /data/lmk/ProteinMPNN
  colabfold: colabfold_batch
  colabfold_params: /data/lmk/colabfold_parameters

backend:
  kind: conda
  envs:
    rfdiffusion: lmk_RFdiffusion
    proteinmpnn: lmk_ProteinMPNN
    rosetta: lmk_Rosetta        # stage 05 interface energy
    colabfold: null           # LocalColabFold is pixi-managed, not a conda env
  tool_env:
    colabfold:
      PATH: /data/lmk/localcolabfold/.pixi/envs/default/bin
      LD_LIBRARY_PATH: /data/lmk/localcolabfold/.pixi/envs/default/lib
