[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclicnano"
version = "0.1.0"
description = "Automated de novo design and in-silico validation of cyclic homo-oligomers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
# httpx is the FastAPI test client's transport; tests/test_webui_http.py needs it.
dev = ["pytest>=7", "httpx>=0.27"]
# The read-only web browser. Kept optional: the pipeline itself never imports a
# web framework, so a machine that only runs designs does not need these.
webui = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
cyclicnano = "cyclicnano.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The web UI is served from files on disk, so they have to be installed next to
# the module rather than left behind in the source tree.
"cyclicnano.webui" = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
